apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rustorch-serve
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rustorch-serve
  minReplicas: 1
  maxReplicas: 16
  metrics:
    - type: Pods
      pods:
        metric:
          name: rustorch_serve_p99_latency_ms
        target:
          type: AverageValue
          averageValue: "100"
    - type: Pods
      pods:
        metric:
          name: rustorch_serve_queue_depth
        target:
          type: AverageValue
          averageValue: "64"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
