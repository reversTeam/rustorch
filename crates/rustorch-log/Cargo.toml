[package]
name = "rustorch-log"
description = "Multi-sink logging + metrics for rustorch (P2.5) — Console SSE, stdout JSON, file, W&B / MLflow / TensorBoard adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
chrono      = { version = "0.4", features = ["serde"] }
tracing     = { workspace = true }
parking_lot = "0.12"
ureq        = { version = "2.10", default-features = false, features = ["json", "tls"], optional = true }
crc32fast   = { version = "1.4", optional = true }

[features]
default = []
# Pulls in HTTP-based sinks (W&B + MLflow) and the binary
# tfevents writer (TensorBoard). Each sink can be tested with a
# mock server via `--features http`.
http = ["dep:ureq", "dep:crc32fast"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
