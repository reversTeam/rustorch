[package]
name = "rustorch-cpu"
description = "CPU backend for rustorch (rayon + SIMD)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# SIMD via portable_simd is nightly-only; the stable path uses scalar + auto-vectorization
nightly-simd = []
# Lightweight profiler hooks emitting Chrome trace JSON. Off by default.
profile      = []

[dependencies]
rustorch-core = { workspace = true }
half          = { workspace = true }
num-traits    = { workspace = true }
thiserror     = { workspace = true }

# rayon is unavailable on wasm32 — guarded at feature level
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
