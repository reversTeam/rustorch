[package]
name        = "rustorch-wasm-demo"
version     = "0.0.1"
edition     = "2021"
rust-version = "1.78"
description = "Browser WASM demo for rustorch — runs a tiny forward pass through the wgpu backend on WebGPU."
license     = "Apache-2.0 OR MIT"
publish     = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustorch-core  = { workspace = true }
rustorch-wgpu  = { workspace = true }
rustorch-serde = { workspace = true }

[features]
default = []
# Enable safetensors-loader GPU tests on a host with a real adapter.
gpu-tests = ["rustorch-wgpu/gpu-tests"]

# Browser bindings — only pulled in when the wasm target is selected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen        = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys              = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
