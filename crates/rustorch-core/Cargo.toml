[package]
name = "rustorch-core"
description = "Tensor, Storage, Layout, dtypes — the zero-ML foundation of rustorch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = true

[features]
default = []
serde   = ["dep:serde"]
# n-dimensional array interop — view + from_ndarray helpers behind a feature
# flag so users don't pay for the ndarray dep when they don't need it.
ndarray = ["dep:ndarray"]
# loom feature replaces std::sync atomics with loom shims — used only by the
# storage/version concurrent-model tests to verify Arc/Atomic correctness
# under all interleavings.
loom    = ["dep:loom"]
# Multi-device Storage variants (P3.Z Storage Option A — Task A).
# Each feature pulls the underlying GPU crate and unlocks a corresponding
# `Storage::*` variant (Wgpu / WgpuShared / Cuda / Metal). Backends
# (rustorch-wgpu / rustorch-cuda / rustorch-metal) ENABLE the matching
# feature on their `rustorch-core` dependency line.
wgpu  = ["dep:wgpu", "dep:pollster"]
cuda  = []   # rustorch-cuda will populate concrete CudaStorage when impl lands (Task M)
# `metal` pulls the macOS-only `metal` crate (Apple Metal Framework
# bindings). The dep is target-gated, so enabling this feature on a
# non-macOS target produces a placeholder MetalStorage (no buffer).
metal = ["dep:metal"]

[dependencies]
half       = { workspace = true }
num-traits = { workspace = true }
bytemuck   = { workspace = true }
thiserror  = { workspace = true }
serde      = { workspace = true, optional = true }
ndarray    = { workspace = true, optional = true }
loom       = { workspace = true, optional = true }
# Multi-device Storage GPU handles (feature-gated, Task A).
wgpu       = { workspace = true, optional = true }
pollster   = { workspace = true, optional = true }

# `metal` is macOS-only. We declare it under a target-gated section
# so non-macOS builds with feature=metal compile to a placeholder
# (MetalStorage with no concrete buffer). The crate is "optional"
# in the macOS table so the `metal` feature controls inclusion.
[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.29", optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest  = { workspace = true }

[[bench]]
name    = "tensor_new"
harness = false

[[bench]]
name    = "shape_broadcast"
harness = false

[[bench]]
name    = "layout_contiguous"
harness = false

[[bench]]
name    = "storage_alloc"
harness = false

[[bench]]
name    = "version_bump"
harness = false

[[bench]]
name    = "view_transpose"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
