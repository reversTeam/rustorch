[package]
name = "rustorch-llm"
description = "LLM-runner core for RusTorch — Llama / Qwen architecture, safetensors checkpoint loader, and the autoregressive decode loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# T241.3 — CUDA backend (LlamaModelCuda). Without this, CPU/Metal still
# build. Requires CUDA toolkit at compile time and runtime on the host.
cuda = ["dep:rustorch-cuda", "dep:cudarc"]

[dependencies]
rustorch-core      = { workspace = true }
rustorch-serde     = { workspace = true }
rustorch-nn        = { workspace = true }
rustorch-autograd  = { workspace = true }
rustorch-tokenizer = { workspace = true }
rustorch-fusion    = { workspace = true }
rustorch-gguf      = { workspace = true }
serde              = { workspace = true, features = ["derive"] }
serde_json         = { version = "1" }
rayon              = { workspace = true }
gemm               = { version = "0.18", default-features = false, features = ["rayon"] }
half               = { workspace = true }

# T241.3 — CUDA backend (gated by `cuda` feature).
rustorch-cuda = { workspace = true, optional = true, features = ["cuda"] }
cudarc        = { version = "0.17", default-features = false, features = ["driver", "cublas", "cublaslt", "nvrtc", "dynamic-loading", "cuda-version-from-build-system", "f16"], optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Used by `qwen_inference_metal` example to wire our T71/T72 Metal
# Q4_K / Q6_K kernels into the rustorch-llm decode loop and measure
# end-to-end tok/s on Apple Silicon.
rustorch-metal = { workspace = true }
rustorch-cpu   = { workspace = true } # T171 — AMX (Accelerate) path for F32 small matmul
metal          = "0.29"
half           = { workspace = true } # T180 — F32 → Q8_0 routing requantization

