[package]
name = "rustorch-attention"
description = "Tiled Flash Attention (forward + backward) for rustorch — pure Rust CPU implementation with online softmax (Welford-style max+sum aggregation), causal/padding masks, and dropout. Mathematically equivalent to naive attention to 1e-4."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rayon = { workspace = true }

# Portable SIMD for the Flash inner softmax loops (max-reduce, exp, sum,
# rescale, write-back normalise). The QK^T and PV matmuls already hit
# Accelerate AMX peak — what's left scalar between them is per-tile
# softmax housekeeping, which pulp vectorises with 4-wide NEON on M-series
# and 8-wide AVX2 on x86 (T8-new).
pulp = { workspace = true }

# State-of-the-art pure-Rust GEMM (faer-rs ecosystem). Used as the
# non-macOS f32 path for Flash Attention's tile-level Q@K^T and P@V
# matmuls. P3.X T6 (flash BLAS path).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "macos")))'.dependencies]
gemm = { version = "0.18", default-features = false, features = ["rayon"] }

[dev-dependencies]
criterion = { workspace = true }
proptest  = { workspace = true }

[[bench]]
name    = "online_softmax_bench"
harness = false

[[bench]]
name    = "flash_forward_bench"
harness = false

[[bench]]
name    = "long_seq_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
