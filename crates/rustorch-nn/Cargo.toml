[package]
name = "rustorch-nn"
description = "Neural network building blocks for rustorch (Module, Linear, Conv, BatchNorm, ...)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
derive = ["dep:rustorch-derive"]

[dependencies]
rustorch-core     = { workspace = true }
rustorch-autograd = { workspace = true }
rustorch-cpu      = { workspace = true }
rustorch-attention = { workspace = true }
# Required by gqa.rs to dispatch to flash_forward.
rustorch-fusion  = { workspace = true }
rustorch-derive   = { workspace = true, optional = true }
half              = { workspace = true }
num-traits        = { workspace = true }
rand              = { workspace = true }
rayon             = { workspace = true }
thiserror         = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
