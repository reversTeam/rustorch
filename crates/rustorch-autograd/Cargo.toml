[package]
name = "rustorch-autograd"
description = "Tape-based reverse-mode autograd engine for rustorch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rustorch-core = { workspace = true }
rustorch-cpu  = { workspace = true }
# Optional: wgpu backend dispatch. Off by default so non-GPU consumers
# don't pay the wgpu compile-time cost. Enable with `--features wgpu`
# (or via the umbrella crate's `wgpu` feature).
rustorch-wgpu = { workspace = true, optional = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }

# P3.Z Task J — Apple Metal direct dispatch. macOS-only crate, so
# the dep is target-gated; non-macOS builds with feature `metal`
# compile but `pick_backend(Device::Metal)` panics at runtime.
[target.'cfg(target_os = "macos")'.dependencies]
rustorch-metal = { workspace = true, optional = true }

[dev-dependencies]
# Used by the gpu-tests training-loop test (Phase D step c6aaded6).
rustorch-optim = { workspace = true }

[features]
default = []
# Enable Variable::device == Wgpu dispatch through the rustorch-wgpu
# backend. Without this feature, dispatching to Wgpu panics with a clear
# error. With it, every autograd op forwards to `wgpu_backend()` when
# its inputs live on the GPU.
wgpu = ["dep:rustorch-wgpu"]
# Enable Variable::device == Metal dispatch through rustorch-metal.
# Pulls rustorch-core[metal] (which gates the Storage::Metal variant)
# and rustorch-metal (the macOS direct backend).
metal = ["rustorch-core/metal", "dep:rustorch-metal"]
# Run wgpu parity tests that require a real GPU adapter. CI without GPU
# skips them (cargo test runs them as `ignored`); local dev enables
# `--features wgpu,gpu-tests` to exercise them.
gpu-tests = ["wgpu"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
