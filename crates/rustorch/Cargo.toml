[package]
name = "rustorch"
description = "Pure Rust port of PyTorch — Tensor library + autograd + nn + optim + multi-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# Default features mirror the user-facing doc v0.7.2 (cuda / bf16 / fp16 / safetensors enabled by default).
# Explicit feature stubs are declared even when their backing crates are not yet implemented,
# so that the public Cargo surface is stable from day one.
[features]
default = ["bf16", "fp16", "safetensors"]
bf16        = []
fp16        = []
safetensors = []
serde       = ["rustorch-core/serde"]
derive      = ["rustorch-nn/derive"]
# Phase-2.5+ backends — feature-gated, no-op until the underlying crate ships
cuda        = []
rocm        = []
mkl         = []
accelerate  = []
mlir        = []
# P3.Y plan, Phase E/F — wgpu (Metal/Vulkan/DX12/WebGPU) training dispatch.
# Pulls rustorch-autograd's `wgpu` feature which transitively brings the
# rustorch-wgpu backend in. Default OFF to keep CPU-only builds light.
wgpu        = ["rustorch-autograd/wgpu", "rustorch-optim/wgpu"]
# P3.Z Task J — Apple Metal direct backend. macOS-only at runtime;
# the dep chain is target-gated so non-macOS builds with feature
# `metal` are no-ops.
metal       = ["rustorch-autograd/metal", "rustorch-optim/metal", "dep:rustorch-metal"]

[[example]]
name = "mnist_wgpu"
required-features = ["wgpu"]

[[example]]
name = "cpu_vs_wgpu_train"
required-features = ["wgpu"]

[[example]]
name = "cpu_vs_metal_train"
required-features = ["metal"]

[dependencies]
rustorch-core     = { workspace = true }
rustorch-cpu      = { workspace = true }
rustorch-autograd = { workspace = true }
# Optional rustorch-metal direct backend (P3.Z Task J). macOS-only at
# runtime; the dep is target-gated below.
rustorch-metal    = { workspace = true, optional = true }
rustorch-nn       = { workspace = true }
rustorch-optim    = { workspace = true }
rustorch-data     = { workspace = true }
rustorch-serde    = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
