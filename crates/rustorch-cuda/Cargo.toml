[package]
name = "rustorch-cuda"
description = "Native CUDA backend for rustorch — feature-gated cudarc + safe wrappers around cuBLAS / cuDNN / cuSPARSE / cuRAND. Without `cuda` feature, the public API still compiles and returns NoDeviceFound so call sites stay portable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Enable real CUDA bindings via cudarc. Requires the CUDA toolkit
# installed on the host and an NVIDIA GPU at runtime. Uses dynamic-loading
# so the same binary can run against any installed CUDA version (12.x or
# 13.x) — important for portability between dev hosts and the GB10 DGX
# Spark which ships CUDA 13.
cuda = ["dep:cudarc"]
# Reserved for future expandable-segment caching allocator path.
cuda-allocator = ["cuda"]

[dependencies]
# Optional cudarc bindings — only pulled in when --features cuda. The
# `driver` feature gives us CudaDevice/CudaStream/DevicePtr; `cublas`
# wraps cuBLAS for gemm/gemv. `dynamic-loading` postpones linking to
# runtime so the toolkit version can vary at install time.
cudarc = { version = "0.17", default-features = false, features = ["driver", "cublas", "cublaslt", "nvrtc", "dynamic-loading", "cuda-version-from-build-system", "f16"], optional = true }
# `half` crate provides f16 / bf16 types used by the BF16 gemm path. Needed
# always (not just under cuda feature) so the scalar fallback can fmt bf16.
half = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
