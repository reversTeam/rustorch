# Nightly-only rustfmt config — invoke via:
#   cargo +nightly fmt -- --config-path rustfmt.nightly.toml
#
# Inherits everything from rustfmt.toml plus the unstable goodies.

max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
edition = "2021"

# Imports: std → external → crate, separated by blank lines
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

# Wrap long comments
wrap_comments = true
comment_width = 100
normalize_comments = true

# Format string literals that don't fit
format_strings = true

# Format documentation in doc comments
format_code_in_doc_comments = true
