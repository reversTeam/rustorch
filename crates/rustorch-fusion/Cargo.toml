[package]
name = "rustorch-fusion"
description = "Eager-mode op fusion for rustorch — DAG pattern matcher + library of hand-fused kernels (matmul+bias+activation, layernorm+linear, residual add+mul, elementwise epilogue chains)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]

# State-of-the-art pure-Rust GEMM (faer-rs ecosystem). Used as the
# non-macOS / fallback f32 matmul path in `patterns::matmul_bias_act`
# to avoid the 562× regression when fused kernels short-circuit the
# tiled CpuBackend matmul. P3.X T2.5.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gemm = { version = "0.18", default-features = false, features = ["rayon"] }

[dev-dependencies]
criterion = { workspace = true }
proptest  = { workspace = true }
# Used by `bench_parallel_sgemm` example to probe dual-AMX
# parallelism on Apple M-series via rayon::join.
rayon     = { workspace = true }

[[bench]]
name    = "fused_matmul_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
