name: wgpu-bench

# Compile-only bench check on every PR. Full benchmark runs (with
# regression gating) require a real GPU runner with stable timings,
# which GitHub-hosted runners do NOT provide. This job catches:
# - benches that fail to compile after a refactor
# - new bench files that aren't wired into Cargo.toml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wgpu-bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  bench-compile:
    name: cargo bench --no-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: wgpu-bench
      - name: Compile examples (bench harnesses)
        run: cargo build -p rustorch-wgpu --release --examples
      - name: Compile criterion bench (dispatch.rs) without running
        # The bench needs a Vulkan adapter for some assertions —
        # we only verify it compiles here. The full timing run lives
        # on a self-hosted GPU runner (TODO: wire up alert-on-regression
        # via github-action-benchmark when the runner lands).
        run: cargo bench -p rustorch-wgpu --features gpu-tests --no-run

  # Sketch of the regression-tracking job. Disabled by default
  # because GitHub-hosted runners have no stable GPU. Activate
  # when a self-hosted GPU runner is wired up — at that point flip
  # `if: false` to `if: github.event_name == 'pull_request'`.
  bench-track:
    name: criterion (regression tracking, disabled)
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run criterion benches
        run: cargo bench -p rustorch-wgpu --features gpu-tests -- --output-format bencher | tee bench.txt
      - name: Store + alert on regression
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '110%'
          comment-on-alert: true
          fail-on-alert: true
