[package]
name = "rustorch-wgpu"
description = "wgpu (WebGPU/Vulkan/Metal/DX12) backend for rustorch — cross-platform GPU + WASM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Enable tests that actually require a GPU adapter to be present.
# Off by default so plain `cargo test` works in CI without GPU.
gpu-tests = []

[dependencies]
# Enable the `wgpu` feature on rustorch-core so we can use Storage::Wgpu
# / WgpuShared directly. Required by Task A (P3.Z) for the round-trip
# elimination — Tensors hold their GPU buffer natively in Storage,
# not as a separate cache outside the type.
rustorch-core = { workspace = true, features = ["wgpu"] }
rustorch-cpu  = { workspace = true }
wgpu          = { workspace = true }
pollster      = { workspace = true }
bytemuck      = { workspace = true }
thiserror     = { workspace = true }

# Used by the CPU baselines in `examples/bench_*` only. Native-only
# (rayon does not target wasm32). Pulled in unconditionally because
# the examples opt into it; the library itself does not depend on it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rayon     = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "dispatch"
harness = false
required-features = ["gpu-tests"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
