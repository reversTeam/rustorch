apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustorch-serve
  labels:
    app: rustorch-serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustorch-serve
  template:
    metadata:
      labels:
        app: rustorch-serve
    spec:
      containers:
        - name: serve
          image: rustorch/serve:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: RUSTORCH_MAX_BATCH
              value: "32"
            - name: RUSTORCH_MAX_WAIT_MS
              value: "20"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rustorch-serve
spec:
  selector:
    app: rustorch-serve
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
