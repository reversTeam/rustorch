[package]
name = "rustorch-cli"
description = "rustorch command-line entry point — `rustorch run / sweep / check / deploy / fork`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "rustorch"
path = "src/main.rs"

# Standalone helper binary that emits the man-pages into a target dir.
# Built on demand: `cargo run -p rustorch-cli --bin rustorch-man -- target/man`.
[[bin]]
name = "rustorch-man"
path = "src/bin/man.rs"
required-features = []

[dependencies]
clap        = { version = "4.5", features = ["derive", "env"] }
clap_mangen = "0.2"
ctrlc       = { version = "3.4", features = ["termination"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = "0.8"
thiserror   = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile   = "3.10"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
