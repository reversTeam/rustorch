[package]
name = "rustorch-amp"
description = "Mixed precision (bf16 / fp16) for rustorch — Autocast scope guard, op promotion list, GradScaler (fp16 only), scalar bf16/fp16 matmul kernels with f32 accumulator. Decoupled from autograd; integration via custom-Function API in a follow-up."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
half = { workspace = true }

# Parallel bf16→f32 up-cast for the GEMM dispatch path (P3.X T7).
# Skipped on wasm32 where rayon is unsupported.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

# bf16/fp16 GEMM dispatches to a single-precision GEMM after up-cast
# (no native bf16 cblas on macOS). gemm crate handles non-macOS;
# Accelerate FFI handles macOS. P3.X T7 (bf16 perf path).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "macos")))'.dependencies]
gemm = { version = "0.18", default-features = false, features = ["rayon"] }

[dev-dependencies]
proptest = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
