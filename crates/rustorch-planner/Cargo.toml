[package]
name = "rustorch-planner"
description = "Memory planner for rustorch — compute buffer lifetimes from an autograd graph and reuse storage via interval-disjoint allocation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rustorch-core = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest  = { workspace = true }
rand      = { workspace = true }

[[bench]]
name    = "lifetime_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
