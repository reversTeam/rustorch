name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Verify the tag matches the workspace package version
      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "rustorch") | .version')
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "Tag v$TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      # Publish in dependency order
      - name: cargo publish (in topological order)
        run: |
          set -e
          for crate in rustorch-codegen rustorch-derive rustorch-core rustorch-autograd \
                       rustorch-cpu rustorch-serde rustorch-data rustorch-nn rustorch-optim rustorch; do
            echo "Publishing $crate..."
            cargo publish -p "$crate" --token "${CARGO_REGISTRY_TOKEN}" || true
            sleep 30  # let crates.io index update before the next dependent crate
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Generate changelog snippet
        id: changelog
        run: |
          echo 'CHANGELOG<<EOF' >> $GITHUB_OUTPUT
          git log --pretty=format:'- %s (%h)' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD)"..HEAD >> $GITHUB_OUTPUT
          echo '' >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Install

            ```toml
            [dependencies]
            rustorch = "${{ github.ref_name }}"
            ```
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
