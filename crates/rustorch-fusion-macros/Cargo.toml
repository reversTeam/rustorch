[package]
name = "rustorch-fusion-macros"
description = "Procedural macros for rustorch-fusion — `fuse_call!` macro that expands compact pipeline syntax into calls into the rustorch-fusion fused kernels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
syn         = { version = "2", features = ["full"] }
quote       = "1"
