# rustorch — pure Rust port of PyTorch
# Multi-backend (CPU, wgpu/WebGPU, CUDA optional) + WASM-first.
#
# Workspace organization aligned with RFC-0001 (P0.1):
#   - rustorch            : umbrella re-export crate (the public API)
#   - rustorch-core       : Tensor, Storage, Layout, dtypes (zero-dep ML)
#   - rustorch-cpu        : CPU backend (rayon + SIMD)
#   - rustorch-autograd   : tape-based reverse-mode autodiff
#   - rustorch-nn         : Module trait + nn modules + activation/loss
#   - rustorch-optim      : Optimizer trait + SGD/Adam/AdamW/Lion/Adafactor + LR schedulers
#   - rustorch-derive     : proc macros (#[derive(Module)])
#   - rustorch-data       : Dataset + DataLoader + Sampler
#   - rustorch-serde      : safetensors reader/writer + state_dict
#   - rustorch-codegen    : build.rs codegen helpers (ops.yaml -> Rust)

[workspace]
resolver = "2"
members = [
    "crates/rustorch",
    "crates/rustorch-core",
    "crates/rustorch-cpu",
    "crates/rustorch-autograd",
    "crates/rustorch-nn",
    "crates/rustorch-optim",
    "crates/rustorch-derive",
    "crates/rustorch-data",
    "crates/rustorch-serde",
    "crates/rustorch-codegen",
    "crates/rustorch-wgpu",
    "crates/rustorch-wasm-demo",
    "crates/rustorch-planner",
    "crates/rustorch-cli",
    "crates/rustorch-console-server",
    "crates/rustorch-sweep",
    "crates/rustorch-log",
    "crates/rustorch-profile",
    "crates/rustorch-serve",
    "crates/rustorch-rpc-internal",
    "crates/rustorch-attention",
    "crates/rustorch-quant",
    "crates/rustorch-fusion",
    "crates/rustorch-amp",
    "crates/rustorch-checkpoint",
    "crates/rustorch-fusion-macros",
]
exclude = [
    "pytorch", # reference clone of upstream PyTorch (read-only)
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
authors = ["rustorch contributors"]
repository = "https://github.com/rustorch/rustorch"
homepage = "https://rustorch.dev"
documentation = "https://docs.rs/rustorch"
readme = "README.md"
keywords = ["machine-learning", "deep-learning", "tensor", "autograd", "neural-network"]
categories = ["science", "mathematics", "science::neuroscience"]

# Shared dependencies — pinned at workspace level so all crates align.
# Members reference via `<dep> = { workspace = true }`.
[workspace.dependencies]
# Internal crates (all start at 0.0.1, bumped together)
rustorch-core      = { version = "0.0.1", path = "crates/rustorch-core" }
rustorch-cpu       = { version = "0.0.1", path = "crates/rustorch-cpu" }
rustorch-autograd  = { version = "0.0.1", path = "crates/rustorch-autograd" }
rustorch-nn        = { version = "0.0.1", path = "crates/rustorch-nn" }
rustorch-optim     = { version = "0.0.1", path = "crates/rustorch-optim" }
rustorch-derive    = { version = "0.0.1", path = "crates/rustorch-derive" }
rustorch-data      = { version = "0.0.1", path = "crates/rustorch-data" }
rustorch-serde     = { version = "0.0.1", path = "crates/rustorch-serde" }
rustorch-codegen   = { version = "0.0.1", path = "crates/rustorch-codegen" }
rustorch-wgpu      = { version = "0.0.1", path = "crates/rustorch-wgpu" }
rustorch-planner   = { version = "0.0.1", path = "crates/rustorch-planner" }
rustorch-attention = { version = "0.0.1", path = "crates/rustorch-attention" }
rustorch-quant     = { version = "0.0.1", path = "crates/rustorch-quant" }
rustorch-fusion    = { version = "0.0.1", path = "crates/rustorch-fusion" }
rustorch-amp       = { version = "0.0.1", path = "crates/rustorch-amp" }
rustorch-checkpoint = { version = "0.0.1", path = "crates/rustorch-checkpoint" }
rustorch-fusion-macros = { version = "0.0.1", path = "crates/rustorch-fusion-macros" }

# Numerics & types
half        = "2.4"   # f16 / bf16
num-traits  = "0.2"
bytemuck    = "1.16"

# Parallelism (CPU backend)
rayon       = "1.10"

# Serialization
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
serde_yaml  = "0.9"

# Error handling
thiserror   = "1.0"

# Logging / instrumentation (used by P2.4 profiling, P2.5 logging)
tracing     = "0.1"

# Random
rand        = { version = "0.8", default-features = false, features = ["std_rng"] }

# Proc-macro support (rustorch-derive)
syn         = { version = "2.0", features = ["full"] }
quote       = "1.0"
proc-macro2 = "1.0"

# Build-time YAML parsing (rustorch-codegen, build.rs)
heck        = "0.5"   # case conversions in codegen

# Portable SIMD (P1.2 task `SIMD abstraction` — wide is stable, fewer features
# than pulp but no nightly required).
wide        = "0.7"

# n-dimensional array interop (P1.1 task `Conversions` — feature-gated).
ndarray     = "0.16"

# WASM targets (no rayon, no fork)
# These are guarded with #[cfg(target_arch = "wasm32")]; declared at workspace level
# so versions are pinned but only pulled in by crates that actually need them.
wasm-bindgen = "0.2"
js-sys       = "0.3"

# GPU backend (Phase 2)
# Native backends are gated per-target so wasm32 builds don't pull them in.
# - macOS / iOS    → metal
# - Linux / Android → vulkan
# - Windows         → dx12 + vulkan (vulkan as fallback)
# - wasm32          → webgpu (added implicitly by wgpu when target_family=wasm)
# `default` already includes wgsl + metal + dx12 + webgpu. We add
# `vulkan-portability` so Linux runners pick up the Vulkan backend too.
wgpu         = { version = "22.1", features = ["vulkan-portability"] }
pollster     = "0.3"

# Dev-only — benchmarks, property tests, concurrent-correctness tests.
# Members reference these through `[dev-dependencies] x = { workspace = true }`.
criterion   = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
proptest    = "1.5"
loom        = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0
debug = true

# Test profile uses opt-level=1 to keep numerical tests fast enough
# without triggering long compile times.
[profile.test]
opt-level = 1

# Document settings — enable all features for docs.rs builds
[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
